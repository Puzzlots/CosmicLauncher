name: polaris
description: An Interstellar Cosmic Launcher.
publish_to: 'none'
version: 0.8.0+0

environment:
  sdk: ^3.10.1

dependencies:
  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.9
  fluent_ui: ^4.16.1
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_layout_grid: ^2.0.8
  flutter_riverpod: ^3.4.3
  math_expressions: ^3.2.0
  dropdown_search: ^7.0.0
  uuid: ^4.6.0
  http: ^1.6.0
  path: ^1.9.1
  nanoid: ^1.0.0
  archive: ^4.3.0
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.1
  file_picker: ^13.1.0
  mime: ^2.1.0
  args: ^2.7.0
  three_js: ^0.3.0
  three_js_advanced_loaders: ^0.3.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  analysis_defaults:
    path: analysis_defaults
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/models/